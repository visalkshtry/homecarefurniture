services:
  - type: web
    name: homecarefurniture
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn homecare_erp.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,homecarefurniture.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://homecarefurniture.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: homecare-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: homecare-db
    databaseName: homecare_furniture
    user: homecare
    plan: free
